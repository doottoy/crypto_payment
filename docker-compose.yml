services:
  app:
    build: .
    container_name: crypto_payment
    restart: always
    env_file:
      - .env
    volumes:
      # payout journal (data/payouts.jsonl): request_id replays and payout history survive redeploys
      - payout-data:/usr/src/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  payout-data:

networks:
  web:
    external: true