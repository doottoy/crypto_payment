name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run app:build

      # Offline tests only: local mock servers stand in for nodes, nothing reaches a real network
      - name: Run unit tests
        run: npm run test:unit

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to test server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ~/crypto_payment
            git pull origin main
            # builds while the old container keeps serving, then swaps it; a failed build leaves the old one running
            docker compose up --build -d
            # the job fails (and the notify job alerts) when the new container is not healthy within a minute
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' crypto_payment 2>/dev/null || echo unknown)
              if [ "$status" = "healthy" ]; then echo "crypto_payment is healthy"; break; fi
              if [ "$i" = "30" ]; then echo "crypto_payment is $status after 60s"; docker logs --tail 50 crypto_payment; exit 1; fi
              sleep 2
            done
          EOF

  notify:
    runs-on: ubuntu-latest
    if: failure()
    needs: [build-and-test, deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Notify on test failure
        run: |
          echo "Sending notification to Telegram"

          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR_NAME=$(git log -1 --pretty=%an)
          COMMIT_AUTHOR_URL="https://github.com/${{ github.actor }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}"
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          FAILURE_STEP=""
          if [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            FAILURE_STEP="Build and Test"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            FAILURE_STEP="Deploy"
          fi

          MESSAGE="<b>🚨 Pipeline Failed 🚨</b>

          Failed step: ${FAILURE_STEP}
          Commit: <a href=\"${COMMIT_URL}\">${COMMIT_MESSAGE}</a>
          Pipeline URL: <a href=\"${WORKFLOW_URL}\">View Pipeline</a>
          Commit author: <a href=\"${COMMIT_AUTHOR_URL}\">${COMMIT_AUTHOR_NAME}</a>"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}"\
            -d "parse_mode=HTML")

          echo "Telegram API response: $RESPONSE"
